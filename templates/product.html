{% extends "base.html" %}
{% block title %}{{ p.name }}{% endblock %}
{% block content %}
<div class="detail">
  <img src="{{ p.image_url or 'https://picsum.photos/seed/'~p.id~'/600/450' }}" alt="{{ p.name }}">
  <div>
    <h1>{{ p.name }}</h1>
    <p class="price">{{ p.price|mnt }}</p>
    <p>{{ p.description }}</p>
    <p class="muted">Үлдэгдэл: {{ p.stock }}</p>
    {% if p.stock > 0 %}
    <form method="post" action="{{ url_for('cart_add', pid=p.id) }}">
      <input type="number" name="qty" value="1" min="1" max="{{ p.stock }}">
      <button>Сагсанд нэмэх</button>
    </form>
    {% endif %}
  </div>
</div>
{% endblock %}
