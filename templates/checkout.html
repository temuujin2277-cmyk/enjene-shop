{% extends "base.html" %}
{% block content %}
<h1>Захиалга баталгаажуулах</h1>
<p>Нийт дүн: <strong>{{ total|mnt }}</strong> ({{ lines|length }} төрлийн бараа)</p>
<form method="post" class="form">
  <label>Нэр <input name="name" required></label>
  <label>Утас <input name="phone" required></label>
  <label>Хаяг <textarea name="address" rows="3" required></textarea></label>
  <button>Захиалга илгээх</button>
</form>
{% endblock %}
